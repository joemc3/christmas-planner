name: christmas_planner
description: Plan Christmas gifts, meals, budget and deadlines in one place.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.0.3

  # Backend
  supabase_flutter: ^2.10.0

  # Routing
  go_router: ^17.0.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.0

  # Utilities
  equatable: ^2.0.7
  intl: ^0.20.2
  logger: ^2.6.0

  # Per-device settings (theme choice)
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
