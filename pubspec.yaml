name: christmas_planner
description: A comprehensive Christmas planning application for gift and meal management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Supabase
  supabase_flutter: ^2.0.0

  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  animations: ^2.0.11
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0

  # Forms & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.1
  logger: ^2.0.2+1
  equatable: ^2.0.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1

  # Routing
  go_router: ^17.0.0

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Date/Time
  table_calendar: ^3.0.9
  syncfusion_flutter_calendar: ^31.2.12

  # Charts & Visualization
  fl_chart: ^1.1.1
  syncfusion_flutter_charts: ^31.2.12

  # Notifications
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

  # File handling
  path_provider: ^2.1.1
  pdf: ^3.10.7
  printing: ^5.11.1
  share_plus: ^12.0.1

  # Image handling
  image_picker: ^1.0.5
  cached_network_image: ^3.3.0

  # URL launcher
  url_launcher: ^6.2.2

  # Barcode scanner
  mobile_scanner: ^7.1.3

  # Currency formatting
  money2: ^6.0.9

  # Search
  flutter_typeahead: ^5.0.1

  # Markdown support
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.7
  riverpod_generator: ^3.0.3
  freezed: ^3.2.3
  json_serializable: ^6.7.1

  # Testing
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
