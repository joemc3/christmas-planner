# Builds and serves the production web bundle on http://localhost:8080.
#
# The backend is Supabase. For local development run the official stack with
# the Supabase CLI instead of hand-rolling containers here:
#
#   supabase start          # starts Postgres, Auth, REST, Realtime, Studio
#   supabase status         # prints the local API URL and anon key
#
# then put those values in .env (see .env.example) before `docker compose up`.

services:
  app:
    build:
      context: .
      args:
        SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set SUPABASE_ANON_KEY in .env}
    ports:
      - "8080:80"
    restart: unless-stopped
